name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src/types/json.ts src/types/settings.ts src/services/settings.gql.ts src/components/settings src/lib/cms-media.ts src/lib/media-server.ts
      - run: npm test
